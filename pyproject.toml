description = "From Solo Agents to Agent Ecosystems with A2A: Multi-Agent Systems with A2A Protocol, MCP, Google ADK, and OpenAI Agents SDK"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "google-adk[a2a]>=1.0.0",
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
    "openai-agents>=0.0.14",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[tool.uv]
package = false
